# main 에 src-tauri/tauri.conf.json 의 변경이 올라오면, 그 version 으로 v<version> 태그가 아직 없을 때만
# Windows(설치 파일 NSIS + 포터블 zip)와 Linux(AppImage)를 빌드해 GitHub Release 로 게시한다. (태그는 게시할 때 자동으로 만든다)
#
#   1) tauri.conf.json, package.json, Cargo.toml 의 version 을 같은 값으로 올리고 커밋
#   2) main 에 push  ->  v<version> 태그와 Release 가 만들어진다
#
# macOS(Apple Silicon)는 GitHub 의 macos 러너가 이 저장소에서 지원되지 않아('macos-14-arm64-us-xl' not supported) 잠시 뺐다.
# 다시 넣으려면 build-ffmpeg.yml 의 macos job, 아래 build 매트릭스·배포 파일 검사(.dmg), ci.yml 매트릭스를 되살린다.
# 같은 버전의 태그가 이미 있으면 아무것도 하지 않는다. 실패했거나 다시 하고 싶으면 Actions 탭에서 수동 실행(workflow_dispatch).
name: release

on:
  push:
    branches: [main]
    paths: ['src-tauri/tauri.conf.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: 버전 읽기, 태그 확인, 버전 일치 확인
        id: ver
        run: |
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          [ "$(node -p "require('./package.json').version")" = "$VER" ] || { echo "::error::package.json version 이 $VER 와 다릅니다."; exit 1; }
          grep -qE "^version = \"$VER\"" src-tauri/Cargo.toml || { echo "::error::Cargo.toml version 이 $VER 와 다릅니다."; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$VER" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VER 태그가 이미 있어 릴리스를 건너뜁니다."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # 경량 LGPL ffmpeg 를 OS 별로 빌드해 아티팩트로 넘긴다. (같은 버전/설정의 캐시가 있으면 빌드 생략)
  ffmpeg:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    uses: ./.github/workflows/build-ffmpeg.yml

  build:
    needs: [prepare, ffmpeg]
    if: needs.prepare.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            triple: x86_64-pc-windows-msvc
            ext: .exe
          - name: linux
            os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            ext: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Tauri 빌드 의존성 (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 프런트엔드 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: sidecar 준비 (yt-dlp, deno)
        shell: pwsh
        run: pwsh scripts/fetch-binaries.ps1

      - name: ffmpeg 받기 (위 job 의 아티팩트)
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-${{ matrix.name }}
          path: ffmpeg-dl

      - name: ffmpeg 배치
        shell: bash
        run: |
          cp "ffmpeg-dl/ffmpeg-${{ matrix.triple }}${{ matrix.ext }}" src-tauri/binaries/
          chmod +x src-tauri/binaries/* || true

      - name: 빌드
        run: pnpm tauri build
        env:
          # 자동 업데이트 파일(.sig) 서명용 키 (로컬: ~/.tauri/slice-youtube.key)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: 포터블 zip 만들기
        if: matrix.name == 'windows'
        shell: pwsh
        run: pwsh scripts/make-portable.ps1 -Version "${{ needs.prepare.outputs.version }}"

      - name: 빌드 결과 검증 (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: pwsh scripts/verify-build.ps1 -Version "${{ needs.prepare.outputs.version }}"

      - name: 빌드 결과 검증 (Linux)
        if: matrix.name == 'linux'
        run: bash scripts/verify-build-linux.sh "${{ needs.prepare.outputs.version }}"

      - name: 빌드 결과 검증 (macOS)
        if: matrix.name == 'macos'
        run: bash scripts/verify-build-macos.sh "${{ needs.prepare.outputs.version }}"

      - name: 배포 파일 업로드
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            dist/*.zip
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/dmg/*.dmg

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-files

      - name: 릴리스 게시
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 아티팩트는 업로드 때의 하위 폴더 구조가 유지되므로 파일만 모은다
          mapfile -t FILES < <(find release-files -type f | sort)
          ls -l "${FILES[@]}"
          # 설치 파일, 포터블 zip, AppImage 가 모두 있어야 한다
          for pat in '*-setup.exe' '*-portable-x64.zip' '*.AppImage' '*-setup.exe.sig' '*.AppImage.sig'; do
            [ -n "$(find release-files -type f -name "$pat" -print -quit)" ] || { echo "::error::배포 파일이 없습니다: $pat"; exit 1; }
          done
          VER="${{ needs.prepare.outputs.version }}"
          # 자동 업데이트용 latest.json (앱이 이 파일로 새 버전을 확인한다)
          VER="$VER" REPO="$GITHUB_REPOSITORY" node scripts/make-latest-json.cjs release-files
          mapfile -t FILES < <(find release-files -type f | sort)
          # 태그가 없으므로 gh 가 이 커밋에 v$VER 태그를 만든다
          gh release create "v$VER" "${FILES[@]}" \
            --target "$GITHUB_SHA" \
            --title "slice-youtube $VER" \
            --generate-notes
