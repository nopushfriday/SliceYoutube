# push / PR 마다 프런트엔드와 Rust 가 Windows, Linux 에서 빌드되는지 확인한다.
# sidecar 바이너리는 git 에 없으므로 빈 파일로 대신한다. (tauri-build 는 externalBin 파일의 존재만 확인)
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, triple: x86_64-pc-windows-msvc, ext: .exe }
          - { os: ubuntu-22.04, triple: x86_64-unknown-linux-gnu, ext: '' }
          - { os: macos-14, triple: aarch64-apple-darwin, ext: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Tauri 빌드 의존성 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file

      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - name: 프런트엔드 타입 검사
        run: pnpm check
      - name: 프런트엔드 빌드
        run: pnpm build

      - name: sidecar 자리 표시 파일
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          for n in yt-dlp ffmpeg deno; do : > "src-tauri/binaries/$n-${{ matrix.triple }}${{ matrix.ext }}"; done

      - name: Rust 검사
        working-directory: src-tauri
        run: |
          cargo check --all-targets
          cargo test
