# cut-dlp 전용 경량 ffmpeg 빌드 (LGPL, GPL 컴포넌트 없음)
#
#  - 이 앱에 필요한 기능만 켠 정적 ffmpeg.exe 를 만들어 아티팩트(ffmpeg)로 올린다.
#  - 앱 빌드와 분리되어 있어 한 번 만들어 두면 계속 재사용한다. (같은 버전/설정의 캐시가 있으면 다시 빌드하지 않음)
#  - 받아서 쓰는 법: release 워크플로가 같은 실행 안에서 아티팩트를 받는다. 로컬은 scripts/build-ffmpeg-win.sh
#
# 라이선스
#  - --enable-gpl / --enable-nonfree 를 쓰지 않는다. (libx264 미사용)
#  - H.264 인코더는 libopenh264(BSD) 와 Windows Media Foundation(h264_mf).
#  - 주의: Cisco 의 H.264 특허 사용료 보증은 "Cisco 가 배포하는 openh264 바이너리"를 그대로 쓸 때만 적용된다.
#    여기서는 MSYS2 패키지(소스 빌드)를 정적 링크하므로 해당 보증은 적용되지 않는다.
#    상용/대규모 배포라면 Cisco 바이너리(DLL) 동적 링크 방식으로 바꾸거나 법무 검토가 필요하다.
name: build-ffmpeg

on:
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: 'ffmpeg 버전 (ffmpeg.org/releases)'
        default: '9.0.2'
      hwaccel:
        description: '하드웨어 인코더(NVENC/AMF/MediaFoundation) 포함 (용량 증가는 1MB 미만)'
        type: boolean
        default: true
      force:
        description: '캐시가 있어도 다시 빌드'
        type: boolean
        default: false
  # release 워크플로에서 호출: 같은 버전/설정의 캐시가 있으면 빌드를 건너뛴다.
  workflow_call:
    inputs:
      ffmpeg_version:
        type: string
        default: '9.0.2'
      hwaccel:
        type: boolean
        default: true
      force:
        type: boolean
        default: false

permissions:
  contents: read

env:
  # configure 옵션을 바꾸면 올린다. (같은 ffmpeg 버전이라도 새로 빌드되게 함)
  CONFIG_REV: '1'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 캐시 키 계산
        id: meta
        shell: bash
        run: |
          HW=${{ inputs.hwaccel && 'hw' || 'sw' }}
          echo "tag=ffmpeg-win-${{ inputs.ffmpeg_version }}-lgpl-${HW}-r${CONFIG_REV}" >> "$GITHUB_OUTPUT"

      # 같은 버전/설정으로 만든 결과가 캐시에 있으면 재사용하고, 없으면(만료 포함) 다시 빌드한다.
      - name: 이전 빌드 결과 확인
        id: cache
        uses: actions/cache@v4
        with:
          path: dist
          key: ${{ inputs.force && format('{0}-{1}', steps.meta.outputs.tag, github.run_id) || steps.meta.outputs.tag }}

      - name: MSYS2 (MinGW-w64) 준비
        if: steps.cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          install: >-
            base-devel
            git
            make
            diffutils
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-openh264
            mingw-w64-x86_64-libvpx
            mingw-w64-x86_64-aom
            mingw-w64-x86_64-opus
            mingw-w64-x86_64-lame
            mingw-w64-x86_64-mpg123
            mingw-w64-x86_64-ffnvcodec-headers
            mingw-w64-x86_64-amf-headers

      - name: ffmpeg 소스 받기
        if: steps.cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          VER="${{ inputs.ffmpeg_version }}"
          # ffmpeg.org 가 러너에서 연결되지 않는 경우가 있어 GitHub 미러(공식 태그 소스)를 먼저 쓰고, 실패하면 ffmpeg.org 를 시도한다.
          CURL="curl -fsSL --connect-timeout 15 --max-time 300 --retry 3 --retry-all-errors --retry-delay 5"
          if $CURL -o ffmpeg-src.tar.gz "https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n${VER}.tar.gz"; then
            SRC=ffmpeg-src.tar.gz
          else
            echo "::warning::GitHub 미러 다운로드 실패, ffmpeg.org 를 시도합니다."
            $CURL -o ffmpeg-src.tar.xz "https://ffmpeg.org/releases/ffmpeg-${VER}.tar.xz"
            SRC=ffmpeg-src.tar.xz
          fi
          echo "$SRC" > src-name.txt
          mkdir ffsrc && tar -xf "$SRC" -C ffsrc --strip-components=1

      - name: configure
        if: steps.cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        working-directory: ffsrc
        run: |
          # 앱에 필요한 기능만 켠다. 빠진 게 있으면 여기에 추가하고 CONFIG_REV 를 올린다.
          OPTS=(
            --arch=x86_64 --target-os=mingw32
            --disable-everything --disable-autodetect
            --disable-debug --disable-doc
            --disable-ffplay --disable-ffprobe
            --enable-static --disable-shared
            --pkg-config-flags=--static
            --extra-ldflags=-static
            # 정적 libmp3lame 은 mpg123(+shlwapi), 정적 openh264 는 C++ 런타임을 요구한다
            "--extra-libs=-lmpg123 -lshlwapi -lstdc++"
            --enable-small --enable-lto
            # mov/matroska 의 압축된 헤더 처리
            --enable-zlib

            # 네트워크(https: Windows 내장 TLS)
            --enable-schannel
            --enable-protocol=file,pipe,http,https,tcp,tls,crypto,hls

            # 외부 코덱 라이브러리 (모두 비-GPL)
            --enable-libopenh264 --enable-libvpx --enable-libaom --enable-libopus --enable-libmp3lame

            # 입출력 포맷
            --enable-demuxer=mov,matroska,hls,mpegts,mp3,ogg,aac,flac,wav
            --enable-muxer=mp4,matroska,webm,mp3,ipod,adts,null
            --enable-parser=h264,vp9,av1,aac,opus,vorbis,mpegaudio,flac

            # 디코더 (구간 정확 컷과 코덱 변환에 필요)
            --enable-decoder=h264,vp9,libaom_av1,aac,opus,vorbis,mp3,flac,pcm_s16le,wrapped_avframe,rawvideo

            # 인코더
            --enable-encoder=libopenh264,libvpx_vp9,libaom_av1,libopus,aac,libmp3lame

            # 비트스트림 필터와 필터
            --enable-bsf=aac_adtstoasc,extract_extradata,vp9_superframe,vp9_superframe_split,av1_frame_merge,av1_frame_split,h264_mp4toannexb,null
            --enable-filter=scale,aresample,format,aformat,null,anull,fps,trim,atrim,setpts,asetpts,volume
            # CI 스모크 테스트용 합성 입력 (용량 영향 거의 없음)
            --enable-indev=lavfi --enable-filter=testsrc2,sine
          )
          if [ "${{ inputs.hwaccel }}" = "true" ]; then
            # 하드웨어 인코더: 헤더만 사용하고 GPU 드라이버 DLL 은 런타임에 로드한다. 없으면 자동으로 실패(소프트웨어로 대체).
            OPTS+=(
              --enable-ffnvcodec --enable-nvenc --enable-amf --enable-d3d11va --enable-mediafoundation
              --enable-encoder=h264_nvenc,h264_amf,h264_mf
            )
          fi
          ./configure "${OPTS[@]}" || { tail -n 50 ffbuild/config.log; exit 1; }

      - name: 빌드
        if: steps.cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        working-directory: ffsrc
        run: |
          make -j"$(nproc)" ffmpeg.exe
          strip ffmpeg.exe
          ls -l ffmpeg.exe

      - name: 검증 (라이선스, 링크, 인코더, 스모크 테스트)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        working-directory: ffsrc
        run: |
          set -e
          ./ffmpeg.exe -hide_banner -version | tee ../version.txt
          # GPL/nonfree 가 섞이지 않았는지
          if grep -Eq -- '--enable-(gpl|nonfree|version3)' ../version.txt; then echo "GPL/nonfree 옵션 감지"; exit 1; fi
          ./ffmpeg.exe -hide_banner -L | head -n 5
          # 시스템 DLL 외에 의존하는 DLL 이 없어야 한다 (정적 빌드)
          echo "--- 의존 DLL"; ldd ffmpeg.exe | grep -vi -E 'windows|system32|ntdll|kernel32' || true
          # 필요한 인코더 존재 확인
          ENC=$(./ffmpeg.exe -hide_banner -encoders)
          for e in libopenh264 libvpx-vp9 libaom-av1 libopus aac libmp3lame; do
            echo "$ENC" | grep -q " $e " || { echo "인코더 없음: $e"; exit 1; }
          done
          # 스모크 테스트: 1초 합성 영상/음성을 각 코덱으로 인코딩
          V="-f lavfi -i testsrc2=size=640x360:rate=30:duration=1"
          A="-f lavfi -i sine=frequency=440:duration=1"
          ./ffmpeg.exe -hide_banner -loglevel error -y $V $A -c:v libopenh264 -b:v 2M -pix_fmt yuv420p -c:a aac t_h264.mp4
          ./ffmpeg.exe -hide_banner -loglevel error -y $V $A -c:v libvpx-vp9 -crf 35 -b:v 0 -c:a libopus t_vp9.mp4
          ./ffmpeg.exe -hide_banner -loglevel error -y $V $A -c:v libaom-av1 -crf 35 -b:v 0 -cpu-used 8 -c:a libopus t_av1.mp4
          ./ffmpeg.exe -hide_banner -loglevel error -y $A -c:a libmp3lame t.mp3
          # 디코드 + 구간 자르기 + 재인코딩 경로 (정확한 컷 시나리오)
          for f in t_h264.mp4 t_vp9.mp4 t_av1.mp4; do
            ./ffmpeg.exe -hide_banner -loglevel error -y -ss 0.2 -to 0.8 -i $f -c:v libopenh264 -b:v 2M -c:a aac "cut_$f"
          done
          # 스트림 복사 병합 경로
          ./ffmpeg.exe -hide_banner -loglevel error -y -i t_h264.mp4 -c copy -movflags +faststart merged.mp4
          echo "스모크 테스트 통과"

      - name: 결과 파일 준비
        if: steps.cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          mkdir dist
          cp ffsrc/ffmpeg.exe dist/ffmpeg-x86_64-pc-windows-msvc.exe   # Tauri sidecar 이름 규칙
          cp ffsrc/COPYING.LGPLv2.1 ffsrc/COPYING.LGPLv3 dist/ 2>/dev/null || true
          SRC=$(cat src-name.txt)
          cp "$SRC" "dist/ffmpeg-${{ inputs.ffmpeg_version }}-source.${SRC#ffmpeg-src.}"   # LGPL 소스 제공
          {
            echo "ffmpeg ${{ inputs.ffmpeg_version }} (LGPL, static, cut-dlp 전용 구성)"
            echo "hwaccel: ${{ inputs.hwaccel }}   config rev: ${CONFIG_REV}"
            echo; cat version.txt
            echo; echo "== 정적 링크된 라이브러리 (MSYS2 패키지) =="
            pacman -Qi mingw-w64-x86_64-openh264 mingw-w64-x86_64-libvpx mingw-w64-x86_64-aom \
              mingw-w64-x86_64-opus mingw-w64-x86_64-lame | grep -E '^(Name|Version|Licenses|URL)'
          } > dist/BUILD-INFO.txt
          ls -l dist

      - name: 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows
          path: dist/*
          retention-days: 30

  # Linux x86_64 (glibc 호환을 위해 오래된 LTS 러너에서 빌드)
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 이전 빌드 결과 확인
        id: cache
        uses: actions/cache@v4
        with:
          path: dist
          key: ${{ inputs.force && format('ffmpeg-linux-{0}-r{1}-{2}', inputs.ffmpeg_version, env.CONFIG_REV, github.run_id) || format('ffmpeg-linux-{0}-r{1}', inputs.ffmpeg_version, env.CONFIG_REV) }}

      - name: 빌드 (configure, make, 검증)
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg-linux.sh "${{ inputs.ffmpeg_version }}"

      - name: 검증 (라이선스, 의존 라이브러리)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          F=src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          # 시스템 기본 라이브러리(libc 등) 외에 따로 설치해야 하는 .so 에 의존하면 안 된다
          echo "--- 의존 라이브러리"; ldd "$F"
          if ldd "$F" | grep -Ei 'libopenh264|libvpx|libaom|libopus|libmp3lame'; then
            echo "코덱 라이브러리가 동적 링크되어 있습니다 (정적 링크 필요)"; exit 1
          fi
          # 모든 인코더가 들어 있는지
          ENC=$("$F" -hide_banner -encoders)
          for e in libopenh264 libvpx-vp9 libaom-av1 libopus aac libmp3lame; do
            echo "$ENC" | grep -q " $e " || { echo "인코더 없음: $e"; exit 1; }
          done

      - name: 결과 파일 준비
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir dist
          cp src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu dist/
          cp .ffmpeg-build/ffmpeg-${{ inputs.ffmpeg_version }}.tar.gz dist/ffmpeg-${{ inputs.ffmpeg_version }}-source.tar.gz
          {
            echo "ffmpeg ${{ inputs.ffmpeg_version }} (LGPL, linux x86_64, cut-dlp 전용 구성)"
            echo "config rev: ${CONFIG_REV}"
            echo; cat .ffmpeg-build/version-linux.txt
          } > dist/BUILD-INFO-linux.txt

      - name: 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux
          path: dist/*
          retention-days: 30

  # macOS Apple Silicon (VideoToolbox 하드웨어 인코더 포함). 러너 버전이 앱의 최소 macOS 버전을 정하므로 macos-14 로 고정한다.
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 이전 빌드 결과 확인
        id: cache
        uses: actions/cache@v4
        with:
          path: dist
          key: ${{ inputs.force && format('ffmpeg-macos-{0}-r{1}-{2}', inputs.ffmpeg_version, env.CONFIG_REV, github.run_id) || format('ffmpeg-macos-{0}-r{1}', inputs.ffmpeg_version, env.CONFIG_REV) }}

      - name: 빌드 (의존 패키지, configure, make, 검증)
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg-macos.sh "${{ inputs.ffmpeg_version }}"

      - name: 결과 파일 준비
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir dist
          cp src-tauri/binaries/ffmpeg-aarch64-apple-darwin dist/
          cp .ffmpeg-build/ffmpeg-${{ inputs.ffmpeg_version }}.tar.gz dist/ffmpeg-${{ inputs.ffmpeg_version }}-source.tar.gz
          {
            echo "ffmpeg ${{ inputs.ffmpeg_version }} (LGPL, macOS arm64, cut-dlp 전용 구성)"
            echo "config rev: ${CONFIG_REV}"
            echo; cat .ffmpeg-build/version-macos.txt
          } > dist/BUILD-INFO-macos.txt

      - name: 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos
          path: dist/*
          retention-days: 30
