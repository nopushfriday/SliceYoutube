name: rel-probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo hi > a.txt
          echo "E: gh release create --generate-notes"
          gh release create probe-e a.txt --target "$GITHUB_SHA" --title probe-e --generate-notes 2>&1 | tail -2 || true
          echo "F: gh release create 노트 없이"
          gh release create probe-f a.txt --target "$GITHUB_SHA" --title probe-f --notes x 2>&1 | tail -2 || true
